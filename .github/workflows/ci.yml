#
# Pull request and main CI. The jobs (Arch, Lint, Nix) are the shared C++ CI
# of the workspace repository (.github/workflows/cpp-ci.yml), which says what
# each one does. This file passes only what differs here.
#
# phosphor-libs comes from the commit cmake/PhosphorComponentsDependencies.cmake
# pins, so its tests run here too. PlasmaZones, which builds this tree from a
# pinned commit, tests it again inside its own build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@v1
    with:
      pin-file: cmake/PhosphorComponentsDependencies.cmake
      nix-verify: |
        module=$(find result/lib -path '*/Phosphor/Components/qmldir' | head -1)
        test -n "$module" || { echo "::error::the package installed no Phosphor.Components module"; exit 1; }
        echo "Module: $(dirname "$module")"
        test -e result/share/phosphor-works/translations/phosphor-components_en.qm \
          || { echo "::error::the package installed no phosphor-components catalog"; exit 1; }
